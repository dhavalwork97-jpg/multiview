name: Launch smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed environment URL to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run launch smoke tests
        run: npx playwright test tests/e2e/launch-boundaries.spec.ts tests/e2e/production-health.spec.ts --project=chromium
