name: Deploy Fly workers (socket / clip / AI)

# Only relevant if you're using Fly.io (fly.toml / fly.clip-worker.toml /
# fly.ai-worker.toml) rather than Render (render.yaml) for these three
# services — Render redeploys automatically via its own native GitHub
# integration once connected, no workflow needed on this repo's side for
# that path. See RENDER_DEPLOYMENT.md vs. DEPLOYMENT_GUIDE.md/
# PHASE3_DEPLOYMENT_GUIDE.md for which one you're running.
on:
  push:
    branches: [main]
    paths:
      - "src/server/socket/**"
      - "src/server/streaming/**"
      - "src/server/ai/**"
      - "src/lib/**" # shared by all three
      - "Dockerfile.socket"
      - "Dockerfile.worker"
      - "Dockerfile.ai-worker"
      - "fly*.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.toml --remote-only
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
      - run: flyctl deploy --config fly.clip-worker.toml --remote-only
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
      - run: flyctl deploy --config fly.ai-worker.toml --remote-only
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
