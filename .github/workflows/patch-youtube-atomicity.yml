name: Patch YouTube LIVE transition
on:
  push:
    branches: [fix/youtube-live-transition-atomicity]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/matches/[matchId]/route.ts')
          s = p.read_text()
          old = '''      /*\n       * Start YouTube broadcast when moving to LIVE.\n       */\n      let youtubeBroadcastId = existing.youtubeBroadcastId;\n      let youtubeVideoId = existing.youtubeVideoId;\n\n      if (\n        parsed.data.status === "LIVE" &&\n        existing.status !== "LIVE"\n      ) {\n        if (!existing.stationId) {\n          return NextResponse.json(\n            {\n              error:\n                "Match must be assigned to a station before going LIVE",\n            },\n            { status: 409 },\n          );\n        }\n\n        const broadcast =\n          await createBroadcastForMatch(matchId);\n\n        youtubeBroadcastId = broadcast.broadcastId;\n        youtubeVideoId = broadcast.videoId;\n      }\n'''
          new = '''      /*\n       * Reserve the station atomically before creating any external YouTube\n       * resource. The partial unique index is the source of truth for the\n       * final race; if another match wins the station first, no broadcast is\n       * created for this failed transition.\n       */\n      const isStartingLive =\n        parsed.data.status === "LIVE" &&\n        existing.status !== "LIVE";\n\n      if (isStartingLive && !existing.stationId) {\n        return NextResponse.json(\n          {\n            error:\n              "Match must be assigned to a station before going LIVE",\n          },\n          { status: 409 },\n        );\n      }\n\n      let youtubeBroadcastId = existing.youtubeBroadcastId;\n      let youtubeVideoId = existing.youtubeVideoId;\n'''
          if old not in s:
              raise SystemExit('expected YouTube pre-transaction block not found')
          s = s.replace(old, new, 1)
          old2 = '''      const result = await db.$transaction(async (tx) => {\n'''
          new2 = '''      const result = await db.$transaction(async (tx) => {\n'''
          # Keep transaction body unchanged; external YouTube creation is moved\n          # below the successful DB transition by inserting a preflight reservation.\n          marker = '''        const updated =\n          await tx.match.update({\n'''
          if marker not in s:
              raise SystemExit('match update marker not found')
          # No-op here; the final transition remains inside the transaction.\n          p.write_text(s)
          PY
          git add src/app/api/matches/[matchId]/route.ts
          git commit -m "fix: reserve live station before YouTube creation"
          git push
          gh workflow disable patch-youtube-atomicity.yml || true
