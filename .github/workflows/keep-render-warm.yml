name: Keep Render free services warm

# All three Render services (render.yaml) run on the free plan, which
# sleeps after 15 minutes with no traffic. A cold start is a bad first
# experience for a viewer connecting to the socket server mid-tournament,
# so this pings all three every 10 minutes — well under the 15-minute
# sleep threshold — to keep them warm. This is the standard, well-known
# workaround for Render's free tier; the alternative is paying for the
# Starter plan ($7/mo/service) to avoid sleep entirely.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping socket server
        if: vars.RENDER_SOCKET_URL != ''
        run: curl -sf "${{ vars.RENDER_SOCKET_URL }}" || echo "socket server ping failed (may just be cold-starting)"
      - name: Ping clip worker
        if: vars.RENDER_CLIP_WORKER_URL != ''
        run: curl -sf "${{ vars.RENDER_CLIP_WORKER_URL }}" || echo "clip worker ping failed"
      - name: Ping AI worker
        if: vars.RENDER_AI_WORKER_URL != ''
        run: curl -sf "${{ vars.RENDER_AI_WORKER_URL }}" || echo "ai worker ping failed"
