# Self-hosted LiveKit server config. Deployed to a cloud VM with a public
# IP (see PHASE3_DEPLOYMENT_GUIDE.md) — NOT Fly/Vercel, because WebRTC
# media needs direct UDP reachability across a wide port range that
# PaaS-style proxied networking doesn't give you.

port: 7880          # signaling (WebSocket) + HTTP API
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true   # station encoders and viewers are on the public internet

redis:
  address: redis:6379   # dedicated Redis container on this same VM — control-plane
                          # traffic only (room state, ingress/egress coordination),
                          # kept separate from the app's Upstash Redis (Socket.IO
                          # pub/sub) so a media-server incident can't touch the app.

keys:
  # Generated at provisioning time — see PHASE3_DEPLOYMENT_GUIDE.md step 2.
  # This same key/secret pair goes into the Next.js app's env as
  # LIVEKIT_API_KEY / LIVEKIT_API_SECRET so it can mint viewer/publish tokens.
  APIKeyPlaceholder: secretPlaceholder

turn:
  enabled: true
  domain: turn.fgcstream.com   # replace with your real domain — see deployment guide DNS step
  tls_port: 5349
  udp_port: 3478

# Room defaults: empty rooms auto-close instead of lingering, and a max
# per-room participant cap keeps one runaway station from starving the
# rest of the tournament's SFU capacity on a single-VM deployment.
room:
  empty_timeout: 300
  max_participants: 5000
  auto_create: false   # rooms are created explicitly by the app when a
                        # station is assigned an ingress — see src/lib/livekit.ts
