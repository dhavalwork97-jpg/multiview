services:
  - type: web
    name: fgc-stream-web
    env: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0
    autoDeploy: yes
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      - key: SOCKET_SERVER_PORT
        value: 4000
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ENCRYPTION_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_EVENT_PRICE_ID
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_DAILY_QUOTA_BUDGET
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_WS_URL
        sync: false
      - key: LIVEKIT_HTTP_URL
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_STORAGE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_BUCKET
        sync: false

  - type: web
    name: fgc-stream-socket
    env: docker
    dockerfilePath: ./Dockerfile.socket
    plan: free
    region: singapore
    branch: main
    autoDeploy: yes
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SOCKET_SERVER_PORT
        value: 4000
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false

  - type: web
    name: fgc-stream-clip-worker
    env: docker
    dockerfilePath: ./Dockerfile.worker
    plan: free
    region: singapore
    branch: main
    autoDeploy: yes
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_STORAGE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_BUCKET
        sync: false

  - type: web
    name: fgc-stream-ai-worker
    env: docker
    dockerfilePath: ./Dockerfile.ai-worker
    plan: free
    region: singapore
    branch: main
    autoDeploy: yes
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
